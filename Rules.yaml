dns:
  enable: true
  ipv6: false
  listen: '0.0.0.0:7874'
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # blacklist（默认）：列在 fake-ip-filter 里的域名不下发假 IP、走真实解析
  fake-ip-filter-mode: blacklist
  use-hosts: true
  use-system-hosts: true

  # ① 只用来解析「下面这些 DNS 服务器自己的域名」，必须是纯 IP
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # ② 解析机场节点域名。必须是不依赖代理就能连上的 DNS。
  #    原来写 udp://127.0.0.1:7874 是绕内核自己的 DNS 口，结果等价但脆弱：
  #    一旦 nameserver 改成走代理，解析节点域名就会变成死循环。
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

  # ③ 命中 DIRECT 的域名用国内 DNS 解析
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

  # ④ 兜底上游：国内 DNS。disable-qtype-65 丢掉 HTTPS(SVCB) 记录查询，
  #    减少查询量与泄露面
  nameserver:
    - https://223.5.5.5/dns-query#disable-qtype-65=true
    - https://doh.pub/dns-query#disable-qtype-65=true

  # ⑤ 污染检测：nameserver 解析出的结果如果不像国内 IP，就改用 fallback 的结果。
  #    fallback 通过「🚀 节点选择」代理出去问 8.8.8.8，所以国内 DNS 看不到你在
  #    解析哪些国外域名。代理挂掉时 fallback 失败会退回 nameserver 的结果，不会断网。
  fallback:
    - https://8.8.8.8/dns-query#🚀 节点选择
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
      - 127.0.0.1/32

  # ⑥ 按域名指定上游。国内域名改用 rule-set 判断——和 fake-ip 过滤、路由规则
  #    引用同一批规则集，三处口径一致（原来是 geosite:cn，和路由的 GEOSITE,CN
  #    不是同一份数据源）
  nameserver-policy:
    '+.captive.apple.com,+.msftconnecttest.com,+.connect.rom.miui.com,+.connectivitycheck.gstatic.com,+.connectivitycheck.platform.hicloud.com':
    - https://223.5.5.5/dns-query
    'rule-set:cn,private':
    - https://223.5.5.5/dns-query#disable-qtype-65=true
    - https://doh.pub/dns-query#disable-qtype-65=true

  # ⑦ 不下发假 IP 的域名：规则集在前，手工补丁在后
  fake-ip-filter:
    - 'rule-set:cn'
    - 'rule-set:private'
    - '*.lan'
    - '*.localdomain'
    - '*.example'
    - '*.invalid'
    - '*.localhost'
    - '*.test'
    - '*.local'
    - '*.home.arpa'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - captive.apple.com
    - connect.rom.miui.com
    - connectivitycheck.platform.hicloud.com
    - 'stun.*.*'
    - 'stun.*.*.*'
    - 'time.*.com'
    - 'time.*.gov'
    - 'time.*.edu.cn'
    - 'ntp.*.com'
    - pool.ntp.org
    - '+.definition-meaning.top'
    - '+.sfr-bouygues.cloud'
    - '+.portail-offres.top'
    - '+.bilivideo.com'
    - '+.douyinvod.com'
    - '+.chat.bilibili.com'
    - '+.feishu.cn'
    - '+.dingtalk.com'
    # 驱动/硬件厂商官网：返回真实 IP，供本机工具直连官方源
    - '+.intel.com'
    - '+.nvidia.com'
    - '+.geforce.com'
    - '+.asus.com'

