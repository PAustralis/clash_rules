# 规则集
# YAML 锚点容器：名字随便起（博主叫 rule-anchor），mihomo 会忽略这个 key，
# 真正起作用的是 YAML 自己的 &锚点 / << 合并语法
rule-anchor:
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  domain_text: &domain_text {type: http, interval: 86400, behavior: domain, format: text}
  ipcidr: &ipcidr {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  classical: &classical {type: http, interval: 86400, behavior: classical, format: yaml}

rule-providers:
  # ── DNS 用：nameserver-policy 和 fake-ip-filter 都引用 ──
  cn: {<<: *domain, url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/cn.mrs", path: ./rp/cn.mrs}
  private: {<<: *domain, url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/private.mrs", path: ./rp/private.mrs}

  # ── 广告拦截：纯文本 domains.txt，省掉每次启动解析 2.7MB YAML ──
  AntiAd: {<<: *domain_text, url: "https://anti-ad.net/domains.txt", path: ./rp/antiad.txt}

  # ── 内容分流 ──
  GitHub: {<<: *domain, url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/github.mrs", path: ./rp/gh.mrs}
