# 基础设置
mixed-port: 7890
allow-lan: true
log-level: info
external-controller: '127.0.0.1:9090'
ipv6: false
unified-delay: true
client-fingerprint: chrome
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    tls: {ports: [443, 8443]}
    http: {ports: [80, 8080-8880]}
    quic: {ports: [443, 8443]}
hosts:
  'mtalk.google.com': 108.177.125.188
  'tagss.pro': 104.26.4.238
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  listen: 0.0.0.0:53
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fake-ip-filter:
    - '*.lan'
    - '*.localdomain'
    - '*.example'
    - '*.invalid'
    - '*.localhost'
    - '*.test'
    - '*.local'
    - '*.home.arpa'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'stun.*.*'
    - 'stun.*.*.*'
    - 'xbox.*.*'
    - 'time.*.com'
    - 'time.*.gov'
    - 'time.*.edu.cn'
    - 'ntp.*.com'
    - 'pool.ntp.org'
    - 'doh.pub'
    - 'dns.pub'
    - 'dot.pub'
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - https://dns.alidns.com/dns-query
  fallback:
    - tls://8.8.8.8:853
    - tls://1.1.1.1:853
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
  nameserver-policy: { 'geosite:cn,apple,private': [system, 119.29.29.29, 223.5.5.5], '*.sankuaei.com': ['https://anycast.bytecdns.com/913b04c3', 'https://anycast.soufunimgs.com/5428ab28', 'https://anycast.jllyzx.com/8c28d4s7', 'https://anycast.pzwzs.com/3b04c545', 'https://anycast.qccnb.com/a192b791', 'https://anycast.xhspic.com/8c28d4s7', 'https://91c7e35b.qluomcd.com:4443/5428ab28'], '*.aixifan7498.com': ['https://anycast.bytecdns.com/913b04c3', 'https://anycast.soufunimgs.com/5428ab28', 'https://anycast.jllyzx.com/8c28d4s7', 'https://anycast.pzwzs.com/3b04c545', 'https://anycast.qccnb.com/a192b791', 'https://anycast.xhspic.com/8c28d4s7', 'https://91c7e35b.qluomcd.com:4443/5428ab28'], '*.afdiancdn.org': ['https://anycast.bytecdns.com/913b04c3', 'https://anycast.soufunimgs.com/5428ab28', 'https://anycast.jllyzx.com/8c28d4s7', 'https://anycast.pzwzs.com/3b04c545', 'https://anycast.qccnb.com/a192b791', 'https://anycast.xhspic.com/8c28d4s7', 'https://91c7e35b.qluomcd.com:4443/5428ab28'] }
    
# 订阅源
proxy-providers:
  GLaDOS:
    type: http
    url: "GLaDOS_URL"
    interval: 86400
    path: ./proxy-providers/glados.yaml
    health-check: {enable: true, interval: 3600, url: http://cp.cloudflare.com/generate_204}
  TAG:
    type: http
    url: "TAG_URL"
    interval: 86400
    path: ./proxy-providers/tag.yaml
    health-check: {enable: true, interval: 3600, url: http://cp.cloudflare.com/generate_204}
  Mojie:
    type: http
    url: "Mojie_URL&flag=clash"
    interval: 86400
    path: ./proxy-providers/mojie.yaml
    health-check: {enable: true, interval: 3600, url: http://cp.cloudflare.com/generate_204}

# 策略组
proxy-groups:
  - {name: 🚀 手动切换, type: select, use: [GLaDOS, TAG, Mojie]}
  - {name: 🇭🇰 香港节点, type: select, use: [GLaDOS, TAG, Mojie], filter: "(?i)(港|HK|Hong Kong|🇭🇰|HongKong)"}
  - {name: 🇨🇳 台湾节点, type: select, use: [GLaDOS, TAG, Mojie], filter: "(?i)(台|新北|彰化|TW|Taiwan)"}
  - {name: 🇸🇬 狮城节点, type: select, use: [GLaDOS, TAG, Mojie], filter: "(?i)(新加坡|坡|狮城|SG|Singapore)"}
  - {name: 🇯🇵 日本节点, type: select, use: [GLaDOS, TAG, Mojie], filter: "(?i)(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)"}
  - {name: 🇺🇲 美国节点, type: select, use: [GLaDOS, TAG, Mojie], filter: "(?i)(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)"}
  - {name: 🇰🇷 韩国节点, type: select, use: [GLaDOS, TAG, Mojie], filter: "(?i)(KR|Korea|KOR|首尔|韩|韓)"}
  - {name: 🏡 家宽节点, type: select, use: [GLaDOS, TAG, Mojie], filter: "(?i)(家宽|家庭)"}
  - {name: 🎥 奈飞节点, type: select, use: [GLaDOS, TAG, Mojie], filter: "(?i)(NF|奈飞|解锁|Netflix|NETFLIX|Media)"}

  - name: 🇭🇰 香港故转
    type: fallback
    use: [GLaDOS, Mojie]
    filter: "(?i)港|HK|Hong Kong|🇭🇰|HongKong"
    exclude-filter: "(?i)(深港|家宽|游戏|剩余|流量|0.5|0.5倍|0.5x|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x|5.0|5倍|5x)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    lazy: true

  - name: 🇨🇳 台湾故转
    type: fallback
    use: [GLaDOS, Mojie]
    filter: "(?i)台|新北|彰化|TW|Taiwan"
    exclude-filter: "(?i)(家宽|游戏|剩余|流量|0.5|0.5倍|0.5x|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x|5.0|5倍|5x)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    lazy: true

  - name: 🇯🇵 日本故转
    type: fallback
    use: [GLaDOS, Mojie]
    filter: "(?i)日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan"
    exclude-filter: "(?i)(家宽|游戏|剩余|流量|0.5|0.5倍|0.5x|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x|5.0|5倍|5x)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    lazy: true

