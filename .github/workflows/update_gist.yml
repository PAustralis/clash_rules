name: Update Config Gist

on:
  push:
    paths:
      - 'Rules.yaml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Generate Final Config
        run: |
          cp Rules.yaml final_config.yaml
          ESC_GLADOS=$(echo "${{ secrets.SUB_GLADOS }}" | sed 's/&/\\&/g')
          ESC_TAG=$(echo "${{ secrets.SUB_TAG }}" | sed 's/&/\\&/g')
          ESC_MOJIE=$(echo "${{ secrets.SUB_MOJIE }}" | sed 's/&/\\&/g')

          sed -i "s|GLaDOS_URL|$ESC_GLADOS|g" final_config.yaml
          sed -i "s|TAG_URL|$ESC_TAG|g" final_config.yaml
          sed -i "s|Mojie_URL|$ESC_MOJIE|g" final_config.yaml

      # ── 以下两步是新增的：校验不过就不推 Gist ──

      - name: Ensure PyYAML
        run: python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --break-system-packages pyyaml

      - name: Validate config structure
        run: python3 .github/scripts/validate_config.py final_config.yaml

      - name: Validate config with mihomo core
        run: |
          set -e
          # 版本可自行上调；compatible 版对 CI 机器的 CPU 指令集要求最低
          VERSION=v1.19.31
          curl -sL -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-compatible-${VERSION}.gz"
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -t -d . -f final_config.yaml

      - name: Update Gist
        run: |
          python3 -c "
          import os, json, requests
          gist_id = os.getenv('GIST_ID')
          token = os.getenv('GIST_TOKEN')
          with open('final_config.yaml', 'r') as f:
              content = f.read()
          headers = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github.v3+json'}
          data = {'files': {'config.yaml': {'content': content}}}
          r = requests.patch(f'https://api.github.com/gists/{gist_id}', headers=headers, data=json.dumps(data))
          if r.status_code == 200:
              print('Success!')
          else:
              print(f'Error: {r.status_code}, {r.text}')
              exit(1)
          "
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
